<!DOCTYPE html>
<html>
<head>
    <title>NeuroSnare v3.0</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>🛡️ NeuroSnare v3.0</h1>
        <div class="stats-grid">
            <div class="card"><h3>Total Attacks</h3><span id="total">0</span></div>
            <div class="card"><h3>Redirected</h3><span id="redirected">0</span></div>
            <div class="card"><h3>Unique IPs</h3><span id="unique">0</span></div>
        </div>
        <div class="section">
            <h2>🚨 Attacker Profiles (Risk Score)</h2>
            <table id="profileTable">
                <tr><th>IP</th><th>Attack Count</th><th>Risk Score</th><th>Fingerprint</th></tr>
            </table>
        </div>
        <div class="section">
            <h2>🔗 Correlated IPs (Same Attacker)</h2>
            <div id="correlationData"></div>
        </div>
        <div class="chart-container"><canvas id="attackChart"></canvas></div>
        <div class="section">
            <h2>📋 Attack Log</h2>
            <table id="attackTable">
                <tr><th>Time</th><th>IP</th><th>Type</th><th>MITRE</th><th>Confidence</th></tr>
            </table>
        </div>
    </div>
    <script src="/static/dashboard.js"></script>
</body>
</html>
